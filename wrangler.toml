name = "token-service"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "token.aptove.com", custom_domain = true }]

[[kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "d1b25e01c8b74cc49b241bcb2cb26366"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
TOKEN_ISSUER    = "https://token.aptove.com"
TOKEN_AUDIENCE  = "https://push.aptove.com"
ADMIN_CLIENT_ID = "CHANGE_ME_BEFORE_DEPLOY"  # REQUIRED: set a unique non-guessable value per deployment
ENFORCE_BINDING = "true"                      # Require binding_secret after first use (set "false" for self-hosted)

# Token bucket rate limit configuration (override per deployment)
TOKEN_BUCKET_CAPACITY = "5"
TOKEN_REFILL_INTERVAL_MS = "3600000"      # 1 hour — 1/hr sustained

# Cloudflare native rate limiters (Tier 1 — hard spacing, per client_id)
[[ratelimits]]
name = "TOKEN_ABUSE_LIMITER"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 1
  period = 60

# Cloudflare native rate limiters (Tier 1 — hard spacing, per IP for public endpoints)
[[ratelimits]]
name = "HEALTH_LIMITER"
namespace_id = "2002"
  [ratelimits.simple]
  limit = 1
  period = 60

[[ratelimits]]
name = "JWKS_LIMITER"
namespace_id = "2003"
  [ratelimits.simple]
  limit = 1
  period = 60

# Secrets (wrangler secret put):
# RS_PRIVATE_KEY       — PEM of RSA-2048 private key (from scripts/generate-keys.mjs)
# ADMIN_CLIENT_SECRET  — secret for the admin client identified by ADMIN_CLIENT_ID
